# Canlı ortam örneği. Değişkenler .env.production dosyasından okunur (.env.example'a bakın).
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d db
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm tools npm run db:init:prod
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm tools npx drizzle-kit push
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm tools npm run db:seed:prod
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d app
# Uygulama 127.0.0.1:${APP_PORT} (varsayılan 3000) üzerinde dinler; önüne HTTPS sonlandıran bir ters vekil koyun.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-havamania}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-havamania}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-havamania}"]
      interval: 5s
      retries: 20

  app:
    build: { context: ., target: run }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-havamania}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-havamania}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/storage

  tools:
    build: { context: ., target: tools }
    profiles: ["tools"]
    depends_on:
      db: { condition: service_healthy }
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-havamania}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-havamania}
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      - uploads:/app/storage

volumes:
  db-data: {}
  uploads: {}
